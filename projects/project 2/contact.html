<!-- 📝 HTML Forms & Inputs (Level 3) -->
<!-- --------------------------------- -->
<!-- Forms handle user interaction like searches, logins, and contact inputs.
  Wrapper (<form>) - Encloses all form elements.
  Input (<input>)  - Self-closing tag & its behavior depends on the type attribute.
                     text - single-line text entry 
                     email -Email validation 
                     password - Masks characters
  Label (<label>)  - Connects text to inputs using matching for and id tags. Clicking label focuses the cursor inside the tied input field. -->



<!-- 🧱 Additional Core Elements -->

    2. Checkbox (type="checkbox") — Choose multiple. Used for yes/no questions or picking multiple choices from a list.
    <input type="checkbox" id="subscribe">
    <label for="subscribe">Subscribe to newsletter</label>

    3. Radio Buttons (type="radio") — Choose only one. Used when a user must select only one option from a group. To group them, they must share the exact same name attribute.
    <input type="radio" id="male" name="gender">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender">
    <label for="female">Female</label>

    4. Dropdown Menu (<select> and <option>) - Used to create a select menu of options.

    <select id="cars">
        <option value="volvo">Volvo</option>

    </select> -->
