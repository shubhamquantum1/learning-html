<!-- Topic 1: Document Structure & The Boilerplate -->
<!-- --------------------------------------------- -->
<!-- HTML (HyperText Markup Language) is not a programming language; it's a markup language. 
     here, we use annotation/tags to tell the browser what that text is 
     e.g., "this is a title," "this is a paragraph," "this is an image").

    Almost all HTML tags come in pairs. These are called "boilerplate" because they are used in almost every webpage.
    The basic structure of an HTML document, or "boilerplate," consists of four main parts:
    1. <!DOCTYPE html>
    2. The <html> tag
    3. The <head> section
    4. The <body> section
-->


<!-- Mandatory declaration that tells browser that this is a modern HTML5 document -->
<!DOCTYPE html>   

<!-- Root tag. Packs everything on page -->
<html>

    <!--Invisible to user. Contains metadata, page title and links to CSS-->
    <head>
        <!-- This will show when hover over the browser tab -->
        <title>My First Webpage</title>
    </head>

    <!-- Body. Everything inside is visible to user-->
    <body>
        Hello, World! I am learning HTML.
    </body>
</html>
