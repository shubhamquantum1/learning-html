<!-- Topic 2: Headings and Paragraphs -->
<!-- --------------------------------------------- -->
<!-- Headings: Ranging from <h1> down to <h6> in decreasing importance and size. <h1> most important heading. Use once per page for that too for SEO
     Paragraphs: Written as <p>. Any block of normal text should be wrapped in a <p> tag.
-->


<!-- Mandatory declaration that tells browser that this is a modern HTML5 document -->
<!DOCTYPE html>   

<!-- Root tag. Packs everything on page -->
<html>

    <!--Invisible to user. Contains metadata, page title and links to CSS-->
    <head>
        <!-- This will show when hover over the browser tab -->
        <title>My First Webpage</title>
    </head>

    <!-- Body. Everything inside is visible to user-->
    <body>
        <!-- <h1> most important heading. Use once per page for that too for SEO -->
        <h1> Welcome to My Coding Journey </h1>
            <!-- <h2> for section heading -->
            <h2> Chapter 1: The Basics </h2>
                <!-- <p>/paragraph for normal texts-->     
                <p> HTML is the backbone of any webpage. 
                    It is used to structure the content of a webpage.
                    It provides structure and semantics (meaning) to the page content.
                </p>
    </body>
</html>
